<style>
  /* Estilos para o ícone flutuante do WhatsApp */
  #whatsapp-float {
    position: fixed;
    bottom: -5px;
    right: 0px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 12px 18px;
    background-color: #ffffff;
    border: 2px solid #25D366;
    border-radius: 50px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  #whatsapp-float:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
  }

  #whatsapp-float img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
  }

  #whatsapp-float .whatsapp-icon {
    width: 35px;
    height: 35px;
  }

  #whatsapp-float span {
    font-size: 15px;
    color: #075E54;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Versão mobile - ajusta para telas pequenas */
  @media (max-width: 600px) {
    #whatsapp-float {
      bottom: 15px;
      right: 15px;
      padding: 10px 14px;
      border-radius: 50px;
    }
    
    #whatsapp-float span {
      font-size: 13px;
    }
    
    #whatsapp-float img {
      width: 32px;
      height: 32px;
    }
    
    #whatsapp-float .whatsapp-icon {
      width: 28px;
      height: 28px;
    }
  }

  /* Versão muito pequena - só ícones */
  @media (max-width: 400px) {
    #whatsapp-float span {
      display: none;
    }
    #whatsapp-float {
      padding: 8px 10px;
    }
  }
</style>
